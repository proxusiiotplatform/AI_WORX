name: Prepare integration test services
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-integration-services.yml']
permissions:
  contents: read
jobs:
  services:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download public service binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p services/nats services/clickhouse artifacts
          gh release view --repo nats-io/nats-server --json tagName > services/nats-release.json
          NATS_TAG=$(jq -r .tagName services/nats-release.json)
          gh release download "$NATS_TAG" --repo nats-io/nats-server --pattern '*linux-amd64.tar.gz' --dir /tmp/nats-download
          tar -xzf /tmp/nats-download/*.tar.gz --strip-components=1 -C services/nats
          gh release view --repo ClickHouse/ClickHouse --json tagName > services/clickhouse-release.json
          CH_TAG=$(jq -r .tagName services/clickhouse-release.json)
          gh release download "$CH_TAG" --repo ClickHouse/ClickHouse --pattern 'clickhouse-common-static-*_amd64.tgz' --dir /tmp/ch-download
          tar -xzf /tmp/ch-download/*.tgz --strip-components=1 -C services/clickhouse
          services/nats/nats-server --version > services/versions.txt
          services/clickhouse/usr/bin/clickhouse local --version >> services/versions.txt
          tar -czf artifacts/nats-service.tar.gz -C services nats nats-release.json versions.txt
          tar -cf - -C services clickhouse clickhouse-release.json | zstd -T0 -3 > artifacts/clickhouse-service.tar.zst
          cd artifacts && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: integration-nats
          path: artifacts/nats-service.tar.gz
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: integration-clickhouse
          path: artifacts/clickhouse-service.tar.zst
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: integration-manifest
          path: |
            artifacts/SHA256SUMS
            services/versions.txt
          retention-days: 7
