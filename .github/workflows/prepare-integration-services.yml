name: Prepare integration test services
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-integration-services.yml']
permissions:
  contents: read
jobs:
  services:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [nats, clickhouse]
    steps:
      - name: Download public service binary and verify release digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          mkdir -p payload artifacts
          if [ "$SERVICE" = nats ]; then
            gh api repos/nats-io/nats-server/releases/latest > release.json
            jq -e '.assets[] | select(.name | endswith("-amd64.deb"))' release.json > asset.json
          else
            gh api repos/ClickHouse/ClickHouse/releases/latest > release.json
            jq -e '.assets[] | select((.name | startswith("clickhouse-common-static_")) and (.name | endswith("_amd64.deb")))' release.json > asset.json
          fi
          jq -r '.name,.browser_download_url' asset.json
          curl --fail --location --retry 3 "$(jq -r .browser_download_url asset.json)" -o package.deb
          DIGEST=$(jq -r '.digest // ""' asset.json)
          if [[ "$DIGEST" == sha256:* ]]; then echo "${DIGEST#sha256:}  package.deb" | sha256sum -c -; fi
          dpkg-deb -x package.deb payload
          cp release.json asset.json payload/
          if [ "$SERVICE" = nats ]; then payload/usr/bin/nats-server --version > payload/versions.txt; else payload/usr/bin/clickhouse local --version > payload/versions.txt; fi
          tar -cf - -C payload . | zstd -T0 -3 > artifacts/$SERVICE-service.tar.zst
          cd artifacts && sha256sum *.tar.zst > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.service }}
          path: artifacts/*
          compression-level: 0
          retention-days: 7
