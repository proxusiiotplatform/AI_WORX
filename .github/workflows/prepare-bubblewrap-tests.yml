name: Prepare public bubblewrap test binary
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-bubblewrap-tests.yml']
permissions:
  contents: read
jobs:
  public-tool:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Build pinned public source without setuid support
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends meson ninja-build libcap-dev pkg-config
          git clone --depth 1 --branch v0.11.2 https://github.com/containers/bubblewrap.git source
          meson setup source/build source -Dsupport_setuid=false -Dman=disabled -Dtests=false
          meson compile -C source/build
          mkdir -p artifact
          cp source/build/bwrap artifact/
          chmod 0755 artifact/bwrap
          artifact/bwrap --version > artifact/version.txt
          git -C source rev-parse HEAD > artifact/source-commit.txt
          ldd artifact/bwrap > artifact/ldd.txt
          cd artifact
          sha256sum bwrap > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: public-bubblewrap-test-binary
          path: artifact/
          retention-days: 3
          if-no-files-found: error
